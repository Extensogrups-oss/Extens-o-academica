<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>G.E.R. · Sabor de Minas</title>
<style>
:root{--bg:#f5f1ea;--cd:#fff;--tx:#231e19;--mu:#6d645b;--bd:#e4dcd0;--in:#f1ebe2;--pr:#d9661f;--sb:#1b2842;--ok:#2a8a55;--wa:#c98a00;--er:#c53a2c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--cd:#201d18;--tx:#f1ebe2;--mu:#a59b8f;--bd:#37312a;--in:#2a2620}}
:root[data-theme=dark]{--bg:#15130f;--cd:#201d18;--tx:#f1ebe2;--mu:#a59b8f;--bd:#37312a;--in:#2a2620}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}
#sb{position:fixed;top:0;bottom:0;left:0;width:240px;background:var(--sb);color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);z-index:40;transition:transform .25s}
.lg{padding:18px 20px;font-size:20px;font-weight:700}.lg small{display:block;font-size:12px;font-weight:400;opacity:.7}
#nv{flex:1;padding:8px 10px;overflow-y:auto}
#nv button{display:flex;gap:10px;width:100%;padding:11px 12px;margin:2px 0;border:0;border-radius:8px;background:none;color:#e8ecf5;text-align:left}
#nv button:hover{background:rgba(255,255,255,.16);color:#fff}
#nv button.on{background:var(--pr);color:#fff}
#fd{margin:10px;padding:12px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13px}#fd b{display:block;font-size:26px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
#app{margin-left:240px}
#tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--cd);border-bottom:1px solid var(--bd)}
#tb h1{font-size:19px;margin:0;flex:1}
#bg{display:none;border:0;background:var(--in);color:var(--tx);font-size:22px;border-radius:8px;padding:4px 12px}
#ub{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:999px;padding:4px 12px 4px 4px;text-align:left}
.av{width:32px;height:32px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-weight:700}
#ub small{display:block;color:var(--mu);font-size:12px;line-height:1}
#um{position:relative}
#umenu{display:none;position:absolute;right:0;top:110%;min-width:200px;background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.2)}#umenu.on{display:block}
#umenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:9px 10px;border-radius:6px}#umenu button:hover{background:var(--in)}
main{padding:20px;max-width:1200px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}.g4 .c,.g2 .c{margin:0}
.c h3{margin:0 0 10px;font-size:15px}.k{color:var(--mu);font-size:13px}.kv{font-size:24px;font-weight:700}
.hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.hd h3{margin:0;flex:1}
.b,.b2{border:1px solid var(--pr);background:var(--pr);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600}
.b2{background:none;color:var(--pr)}.sm{padding:5px 9px;font-size:13px}.b:hover{filter:brightness(1.1)}.b2:hover{background:var(--in)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}th{color:var(--mu);font-weight:600;font-size:12px}
.bd{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}.r{background:var(--er)}.y{background:var(--wa)}.g{background:var(--ok)}
label{display:block;margin:0 0 10px;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;padding:9px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.fl>*{flex:1 1 140px;margin:0}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;align-items:center;justify-content:center;padding:12px}#md.on{display:flex}
.mb{background:var(--cd);border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:90vh;overflow:auto}.mb h2{margin:0 0 14px;font-size:18px}
.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.r2{display:flex;gap:6px}.r2 select{flex:2}.r2 input{flex:1}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;opacity:0;pointer-events:none;transition:.2s;max-width:90%}#ts.on{opacity:1}
.bar{height:12px;background:var(--in);border-radius:6px;position:relative;margin:4px 0 12px}.bar i{display:block;height:100%;border-radius:6px}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx)}
.dn{width:130px;height:130px;border-radius:50%}.dn2{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pt{text-align:left;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;padding:14px}.pt:hover{border-color:var(--pr)}.pt s{display:block;font-size:30px;text-decoration:none}
.pdv{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.ln{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.ln span{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;color:var(--mu);font-size:12px}
.dy{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:4px;min-height:58px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}.dy.td{outline:2px solid var(--pr)}
.dy em{font-style:normal;font-size:11px;color:#fff;border-radius:4px;padding:0 4px}
@media(max-width:899px){#sb{transform:translateX(-100%)}#sb.open{transform:none}#ov.on{display:block}#app{margin-left:0}#bg{display:block}.pdv{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:12px}#tb{padding:8px 12px}.hm{display:none}#ub{padding:4px}.dy{min-height:46px;font-size:12px}.dy em{font-size:9px}}
</style></head><body>
<aside id="sb"><div class="lg">🍲 G.E.R.<small>Sabor de Minas</small></div><nav id="nv"></nav><div id="fd"></div></aside><div id="ov" data-a="sbx"></div>
<div id="app"><header id="tb"><button id="bg" data-a="sbo" aria-label="Menu">☰</button><h1 id="pt"></h1><div id="um"></div></header><main id="mn"></main></div>
<div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),TD=()=>key(new Date()),
M=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),N=v=>v.toLocaleString('pt-BR',{maximumFractionDigits:3}),
E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R={dono:['Dono','*','*','Acesso total'],gerente:['Gerente','*','*','Acesso total'],estoquista:['Estoquista',['dashboard','insumos','auditoria'],['estoque','perda','ficha'],'Insumos, entradas e perdas'],cozinheiro:['Cozinheiro(a)',['dashboard','insumos','cardapio','auditoria'],['perda','ficha'],'Cardápio, ficha técnica e perdas'],garcom:['Garçom/Caixa',['dashboard','cardapio','vendas','auditoria'],['venda','imp'],'Cardápio, comandas, vendas e importação']};
const NAV=[['dashboard','📊','Dashboard'],['insumos','📦','Insumos'],['cardapio','🍲','Cardápio'],['demanda','📅','Demanda'],['vendas','🛒','Vendas'],['auditoria','📜','Auditoria'],['usuarios','🔐','Usuários']];
const ICO={'Prato feito':'🍛','Marmitex':'🥡','Bebidas':'🥤','Sobremesas':'🍮'},CATS=Object.keys(ICO);
const tot=(it,pr)=>it.reduce((a,[id,q])=>a+q*pr.find(p=>p.id==id).preco,0);
const seed=()=>{const t=TD(),s={u:null,
ins:[[1,'Carne suína','kg',28,20,22],[2,'Costela suína','kg',12.5,20,34],[3,'Feijão vermelho','kg',40,15,9],[4,'Arroz','kg',60,25,5],[5,'Farinha de mandioca','kg',12,5,7],[6,'Couve','kg',6,3,8],[7,'Linguiça','kg',15,8,25],[8,'Ovos','un',120,60,.9],[9,'Refrigerante lata','un',90,48,3],[10,'Doce de leite','kg',5,2,30],[11,'Queijo minas','kg',9,4,38],[12,'Embalagem marmitex','un',200,100,.8]].map(([id,nome,un,saldo,min,custo])=>({id,nome,un,saldo,min,custo})),
pr:[[1,'Tutu à Mineira','Prato feito',32,[[3,.25],[6,.1],[5,.05],[7,.1]]],[2,'Feijão Tropeiro','Prato feito',34,[[3,.2],[5,.08],[7,.1],[8,1],[6,.05],[4,.15]]],[3,'Prato Feito Suíno','Prato feito',28,[[1,.2],[4,.15],[3,.15],[6,.05]]],[4,'Marmitex Costela','Marmitex',38,[[2,.3],[4,.2],[3,.25],[12,1]]],[5,'Marmitex Suíno','Marmitex',30,[[1,.25],[4,.2],[3,.25],[12,1]]],[6,'Refrigerante lata','Bebidas',6,[[9,1]]],[7,'Doce de leite c/ queijo','Sobremesas',14,[[10,.1],[11,.08]]]].map(([id,nome,cat,preco,f])=>({id,nome,cat,preco,f})),
cal:{'2026-09-25':{f:1.5,d:'Sexta de movimento'},'2026-10-10':{f:2.2,d:'Feriado prolongado (sábado)'},'2026-10-11':{f:2.5,d:'Feriado prolongado'},'2026-10-12':{f:2.5,d:'Feriado — N. Sra. Aparecida'},'2026-11-02':{f:2.5,d:'Feriado — Finados'},'2026-12-25':{f:2.2,d:'Natal'}},v:[],log:[],rel:[],map:{},imp:[]};
s.v=[[[1,2],[6,2]],[[5,2]],[[4,1],[6,1]],[[7,2]]].map(it=>({dt:t,it,v:tot(it,s.pr),pg:'Pix'}));return s};
let S,P='dashboard',cart={},T,OK,CM={y:new Date().getFullYear(),m:new Date().getMonth()};
try{S=JSON.parse(localStorage.getItem('ger'))}catch(e){}S=S||seed();S.map=S.map||{};S.imp=S.imp||[];S.u=null;S.users=S.users||[];S.users.forEach(u=>{if(u.r==='caixa'||u.r==='garcom')u.r='garcom'});S.lk=S.lk||{};
const save=()=>{try{localStorage.setItem('ger',JSON.stringify({...S,u:null}))}catch(e){}},
I=id=>S.ins.find(x=>x.id==id),PR=id=>S.pr.find(x=>x.id==id),
wd=k=>new Date(k+'T12:00').getDay(),fat=k=>S.cal[k]?S.cal[k].f:([0,6].includes(wd(k))?1.8:1),
dsc=k=>S.cal[k]?S.cal[k].d:([0,6].includes(wd(k))?'Fim de semana':'Dia comum'),
fc=f=>f>=2?'var(--er)':f>1.2?'var(--pr)':'var(--ok)',
md=i=>i.min*fat(TD()),st=i=>{const m=md(i);return i.saldo<m?'r':i.saldo<=m*1.3?'y':'g'},
bd=i=>{const s=st(i);return `<span class="bd ${s}">${{r:'🔴 Crítico',y:'🟡 Atenção',g:'🟢 Seguro'}[s]}</span>`},
cu=p=>p.f.reduce((a,[i,q])=>a+q*I(i).custo,0),
ok=p=>p=='usuarios'?S.u.r=='dono':R[S.u.r][1]=='*'||R[S.u.r][1].includes(p),can=a=>{if(a=='usr')return S.u.r=='dono';const x=R[S.u.r][2];return x=='*'||x.includes(a)},
L=a=>{S.log.unshift({t:Date.now(),u:S.u.n,r:R[S.u.r][0],a});S.log=S.log.slice(0,200)},
toast=m=>{const t=$('#ts');t.textContent=m;t.className='on';clearTimeout(T);T=setTimeout(()=>t.className='',3200)},
cl=()=>{$('#md').className='';OK=0},done=m=>{cl();save();render();toast(m)},
fld=(l,n,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" ${x}></label>`,
sel=(l,n,o,v)=>`<label>${l}<select name="${n}">${o.map(([a,b])=>`<option value="${a}"${String(a)==String(v)?' selected':''}>${E(b)}</option>`).join('')}</select></label>`,
io=()=>S.ins.map(i=>[i.id,i.nome+' ('+i.un+')']),
mo=(t,b,o,lab='Salvar',nc)=>{$('#md').innerHTML=`<div class="mb"><form id="mf"><h2>${t}</h2>${b}<div class="ac">${nc?'':'<button type="button" class="b2" data-a="cls">'+(o?'Cancelar':'Fechar')+'</button>'}${o?`<button class="b">${lab}</button>`:''}</div></form></div>`;$('#md').className='on';OK=o};
const V={
dashboard(){const k=TD(),f=fat(k),vs=S.v.filter(v=>v.dt==k),q={},cat={};vs.forEach(v=>v.it.forEach(([id,n])=>{const p=PR(id);if(!p)return;q[id]=(q[id]||0)+n;cat[p.cat]=(cat[p.cat]||0)+n*p.preco}));
const top=Object.entries(q).sort((a,b)=>b[1]-a[1])[0],ur=S.ins.filter(i=>st(i)!='g').sort((a,b)=>st(a)<st(b)?1:-1),
bars=[...S.ins].sort((a,b)=>a.saldo/md(a)-b.saldo/md(b)).slice(0,6).map(i=>{const m=md(i),sc=Math.max(i.saldo,m*1.6);return `<div class="k">${E(i.nome)} — ${N(i.saldo)} ${i.un} (mín. ${N(m)})</div><div class="bar"><i class="${st(i)}" style="width:${i.saldo/sc*100}%"></i><u style="left:${m/sc*100}%"></u></div>`}).join(''),
cs=['#d9661f','#2a8a55','#3d6fd0','#c98a00'],tt=Object.values(cat).reduce((a,b)=>a+b,0);let acc=0;const fv=vs.reduce((a,v)=>a+v.v,0),cmv=vs.reduce((a,v)=>a+v.it.reduce((b,[id,n])=>b+(PR(id)?cu(PR(id))*n:0),0),0),lu=fv-cmv,mgn=fv?lu/fv*100:0,pos=lu>=0;
const cg=tt?Object.entries(cat).map(([c,v],n)=>{const a=acc;acc+=v/tt*100;return `${cs[n%4]} ${a}% ${acc}%`}).join(','):'var(--in) 0 100%';
return `<div class="g4"><div class="c"><div class="k">Fator do dia</div><div class="kv" style="color:${fc(f)}">${f.toFixed(1)}x</div><div class="k">${dsc(k)}</div></div>
<div class="c"><div class="k">Faturamento hoje</div><div class="kv">${M(vs.reduce((a,v)=>a+v.v,0))}</div><div class="k">${vs.length} vendas</div></div>
<div class="c"><div class="k">Alertas críticos</div><div class="kv" style="color:var(--er)">${S.ins.filter(i=>st(i)=='r').length}</div><div class="k">insumos abaixo do mínimo</div></div>
<div class="c"><div class="k">Mais vendido hoje</div><div class="kv" style="font-size:18px">${top?E(PR(top[0]).nome):'—'}</div><div class="k">${top?top[1]+' unid.':'sem vendas'}</div></div></div>
${['dono','gerente'].includes(S.u.r)?`<div class="c" style="border-left:5px solid ${pos?'var(--ok)':'var(--er)'}"><div class="hd"><h3>Resultado do dia</h3><span class="bd ${pos?'g':'r'}">${!vs.length?'Sem vendas hoje':pos?'🟢 Com lucro':'🔴 Prejuízo'}</span></div><div class="g4" style="margin:0"><div><div class="k">Faturamento</div><div class="kv">${M(fv)}</div></div><div><div class="k">CMV (custo dos pratos)</div><div class="kv">${M(cmv)}</div></div><div><div class="k">Lucro bruto</div><div class="kv" style="color:${pos?'var(--ok)':'var(--er)'}">${M(lu)}</div></div><div><div class="k">Margem bruta</div><div class="kv" style="color:${pos?'var(--ok)':'var(--er)'}">${mgn.toFixed(1)}%</div></div></div><p class="k" style="margin:10px 0 0">Lucro bruto = faturamento − CMV (soma dos insumos gastos nos pratos vendidos hoje). Não inclui despesas fixas como salários, aluguel e energia.</p></div>`:''}
<div class="g2"><div class="c"><h3>Saldo vs. mínimo dinâmico (linha = mínimo)</h3>${bars}</div>
<div class="c"><h3>Vendas por categoria (hoje)</h3><div class="dn2"><div class="dn" style="background:conic-gradient(${cg});-webkit-mask:radial-gradient(circle 38px,#0000 98%,#000);mask:radial-gradient(circle 38px,#0000 98%,#000)"></div><div>${Object.keys(cat).map((c,n)=>`<div><span style="color:${cs[n%4]}">●</span> ${c} — ${M(cat[c])}</div>`).join('')||'<span class="k">Sem vendas hoje</span>'}</div></div></div></div>
<div class="c"><div class="hd"><h3>Lista de compras urgentes</h3><button class="b sm" data-a="pc" data-need="estoque">Gerar pedido de compra</button><button class="b2 sm" data-a="ent" data-id="${ur[0]?ur[0].id:1}" data-need="estoque">Dar entrada em estoque</button></div>
<div class="tw"><table><tr><th>Insumo</th><th>Saldo</th><th>Mín. hoje</th><th>Status</th><th></th></tr>${ur.map(i=>`<tr><td>${E(i.nome)}</td><td>${N(i.saldo)} ${i.un}</td><td>${N(md(i))}</td><td>${bd(i)}</td><td><button class="b2 sm" data-a="ent" data-id="${i.id}" data-need="estoque">+ Entrada</button></td></tr>`).join('')||'<tr><td colspan=5>Tudo em dia 🎉</td></tr>'}</table></div></div>`},
insumos(){const q=(window.fq||'').toLowerCase(),fs=window.fs||'';const l=S.ins.filter(i=>i.nome.toLowerCase().includes(q)&&(!fs||st(i)==fs));
return `<div class="fl"><input id="fq" placeholder="Buscar insumo…" value="${E(window.fq||'')}"><select id="fs"><option value="">Todos os status</option>${[['g','Verde'],['y','Amarelo'],['r','Vermelho']].map(([a,b])=>`<option value="${a}"${fs==a?' selected':''}>${b}</option>`).join('')}</select><button class="b" data-a="ni" data-need="estoque">+ Novo Insumo</button></div>
<div class="c tw"><table><tr><th>Insumo</th><th>Saldo físico</th><th>Mín. base</th><th>Mín. dinâmico hoje</th><th>Status</th><th>Ações</th></tr>${l.map(i=>`<tr><td>${E(i.nome)}</td><td>${N(i.saldo)} ${i.un}</td><td>${N(i.min)}</td><td>${N(md(i))}</td><td>${bd(i)}</td><td style="white-space:nowrap"><button class="b sm" data-a="ent" data-id="${i.id}" data-need="estoque">+ Entrada</button> <button class="b2 sm" data-a="perda" data-id="${i.id}" data-need="perda">− Perda/Ajuste</button> <button class="b2 sm" data-a="ri" data-id="${i.id}" data-need="estoque">🗑 Remover</button></td></tr>`).join('')||'<tr><td colspan=6>Nenhum insumo encontrado.</td></tr>'}</table></div>`},
cardapio(){return `<div class="hd"><h3>${S.pr.length} pratos</h3>${can('cardapio')?'<button class="b" data-a="np" data-need="cardapio">+ Novo Prato</button>':''}</div><div class="pg">${S.pr.map(p=>`<div class="c" style="margin:0"><div style="font-size:30px">${ICO[p.cat]}</div><b>${E(p.nome)}</b><div class="k">${p.cat} · ${M(p.preco)}</div>${can('ficha')?`<button class="b2 sm" style="margin-top:10px" data-a="fic" data-id="${p.id}" data-need="ficha">Ver Ficha Técnica</button>`:''} ${can('cardapio')?`<button class="b2 sm" style="margin-top:10px" data-a="rp" data-id="${p.id}" data-need="cardapio">🗑 Remover</button>`:''}</div>`).join('')}</div>`},
demanda(){const{y,m}=CM,f0=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),t=TD();let c='';for(let i=0;i<f0.getDay();i++)c+='<i></i>';
for(let d=1;d<=n;d++){const k=y+'-'+pad(m+1)+'-'+pad(d),f=fat(k);c+=`<button class="dy${k==t?' td':''}" data-a="day" data-k="${k}" data-need="demanda"><span>${d}</span><em style="background:${fc(f)}">${f.toFixed(1)}x</em></button>`}
